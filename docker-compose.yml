# GNOSIA with Docker
#   docker compose up -d --build                     # app + MySQL → http://localhost:8000
#   docker compose --profile tunnel up -d --build    # + temporary public URL (https://….trycloudflare.com)
# Secrets come from ./.env (created by scripts/tunnel.ps1 or scripts/tunnel.sh, see .env.example).

name: gnosia

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gnosia
      MYSQL_USER: gnosia
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?isi MYSQL_PASSWORD di file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?isi MYSQL_PASSWORD di file .env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugnosia", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 25

  app:
    build: .
    image: gnosia-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GNOSIA_DB_HOST: db
      GNOSIA_DB_PORT: "3306"
      GNOSIA_DB_NAME: gnosia
      GNOSIA_DB_USER: gnosia
      GNOSIA_DB_PASSWORD: ${MYSQL_PASSWORD}
      GNOSIA_SECRET_KEY: ${SECRET_KEY:?isi SECRET_KEY di file .env}
      GNOSIA_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # cookies only over HTTPS (the tunnel) — browsers still accept them on http://localhost
      GNOSIA_COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${APP_PORT:-8000}:8000"

  # Cloudflare quick tunnel: no account needed, a new random URL on every start.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol ${TUNNEL_PROTOCOL:-auto} --url http://app:8000

volumes:
  mysqldata:
