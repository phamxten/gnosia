<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <linearGradient id="nosiBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A384A" />
      <stop offset="100%" stop-color="#262432" />
    </linearGradient>
  </defs>

  <g transform="translate(160, 160)" filter="url(#softShadow)">
    <!-- Curly brace wings -->
    <text x="-120" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="120" font-weight="900" fill="#8B5CF6" opacity="0.95" text-anchor="middle">{</text>
    <text x="120" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="120" font-weight="900" fill="#8B5CF6" opacity="0.95" text-anchor="middle">}</text>

    <!-- Ears -->
    <path d="M-60 -80 L-30 -35 L-75 -25 Z" fill="#2E2C3D" />
    <path d="M60 -80 L30 -35 L75 -25 Z" fill="#2E2C3D" />

    <!-- Body -->
    <rect x="-70" y="-55" width="140" height="160" rx="60" fill="url(#nosiBodyGrad)" stroke="#4A475E" stroke-width="2.5" />

    <!-- Belly -->
    <path d="M-40 65 C-40 25 40 25 40 65 C40 88 -40 88 -40 65 Z" fill="#F4EFE4" opacity="0.95" />

    <!-- Eyes (White Circles) -->
    <circle cx="-29" cy="0" r="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="29" cy="0" r="28" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Pupils -->
    <circle cx="-27" cy="1" r="13" fill="#18171E" />
    <circle cx="31" cy="1" r="13" fill="#18171E" />

    <!-- Specular Highlight -->
    <circle cx="-32" cy="-5" r="5" fill="#FFFFFF" />
    <circle cx="26" cy="-5" r="5" fill="#FFFFFF" />

    <!-- Eyebrows (Concentrated & Friendly) -->
    <path d="M-50 -32 L-16 -24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <path d="M50 -32 L16 -24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85" />

    <!-- Beak -->
    <path d="M-9 24 L9 24 L0 40 Z" fill="#F59E0B" />
  </g>
</svg>
