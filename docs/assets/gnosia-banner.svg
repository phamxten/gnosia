<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16151D" />
      <stop offset="50%" stop-color="#1F1E29" />
      <stop offset="100%" stop-color="#282637" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B293A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E1D27" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="100%" stop-color="#FDA085" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bg)" />

  <!-- Grid Pattern -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" />
    <path d="M60 0 V420 M180 0 V420 M300 0 V420 M420 0 V420 M540 0 V420 M660 0 V420 M780 0 V420 M900 0 V420 M1020 0 V420 M1140 0 V420" />
  </g>

  <!-- Decorative Orbs -->
  <circle cx="1060" cy="90" r="140" fill="#7048B6" opacity="0.18" filter="url(#glow)" />
  <circle cx="820" cy="340" r="110" fill="#2B5EA7" opacity="0.15" filter="url(#glow)" />
  <circle cx="160" cy="320" r="130" fill="#1E7E55" opacity="0.12" filter="url(#glow)" />

  <!-- Mascot Nosi Illustration Card (Right Side) -->
  <g transform="translate(860, 50)" filter="url(#shadow)">
    <!-- Card Frame -->
    <rect width="270" height="320" rx="20" fill="url(#cardGrad)" stroke="#3E3B52" stroke-width="1.5" />
    
    <!-- Nosi Mascot SVG Large -->
    <g transform="translate(35, 30)">
      <!-- Curly brace wings -->
      <text x="-5" y="155" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="95" font-weight="900" fill="#A78BFA" opacity="0.9">{</text>
      <text x="160" y="155" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="95" font-weight="900" fill="#A78BFA" opacity="0.9">}</text>

      <!-- Owl Ears -->
      <path d="M50 45 L72 75 L40 82 Z" fill="#3D3A4F" />
      <path d="M150 45 L128 75 L160 82 Z" fill="#3D3A4F" />

      <!-- Owl Body -->
      <rect x="36" y="60" width="128" height="150" rx="56" fill="#343243" stroke="#4C4863" stroke-width="2" />
      
      <!-- Belly -->
      <path d="M64 175 C64 140 136 140 136 175 C136 195 64 195 64 175 Z" fill="#F4EFE4" opacity="0.95" />

      <!-- Large Curious Eyes -->
      <g>
        <!-- Eye Rings -->
        <circle cx="73" cy="115" r="26" fill="#FFFFFF" />
        <circle cx="127" cy="115" r="26" fill="#FFFFFF" />
        <!-- Pupils -->
        <circle cx="75" cy="116" r="12" fill="#18171E" />
        <circle cx="129" cy="116" r="12" fill="#18171E" />
        <!-- Pupil Highlights -->
        <circle cx="71" cy="111" r="4.5" fill="#FFFFFF" />
        <circle cx="125" cy="111" r="4.5" fill="#FFFFFF" />
      </g>

      <!-- Beak -->
      <path d="M92 138 L108 138 L100 152 Z" fill="#F59E0B" />
      <!-- Eyebrows / Focus -->
      <path d="M54 84 L84 92" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
      <path d="M146 84 L116 92" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Nosi Tag Pill -->
    <rect x="55" y="260" width="160" height="36" rx="18" fill="#181720" stroke="#4C4863" stroke-width="1" />
    <text x="135" y="283" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0" letter-spacing="1">NOSI · MASKOT { }</text>
  </g>

  <!-- Left Side: Branding, Typography, Tagline, Badges -->
  <g transform="translate(80, 75)">
    <!-- Badge / Eyebrow -->
    <g>
      <rect width="210" height="32" rx="16" fill="#2B293A" stroke="#484460" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10B981" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" letter-spacing="1">INTERACTIVE CODING OS</text>
    </g>

    <!-- Project Title -->
    <g transform="translate(0, 78)">
      <text font-family="'Georgia', 'Times New Roman', serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1">GNOSIA</text>
      <text x="245" y="-5" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#A78BFA">v1.0</text>
    </g>

    <!-- Tagline & Philosophy -->
    <g transform="translate(0, 118)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" fill="#F3F4F6">
        Pahami dulu, <tspan fill="#FBBF24" font-style="italic">baru ngoding.</tspan>
      </text>
      <text y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9CA3AF" font-weight="400">
        Platform belajar pemrograman interaktif dengan 4 fase kognitif,
      </text>
      <text y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#9CA3AF" font-weight="400">
        didampingi maskot Nosi, runner sandbox aman, dan cockpit guru cerdas.
      </text>
    </g>

    <!-- 4 Phases Chips -->
    <g transform="translate(0, 215)">
      <!-- Phase 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="38" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2" />
        <circle cx="18" cy="19" r="6" fill="#3B82F6" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#93C5FD">1 · Pahami</text>
      </g>
      
      <!-- Arrow 1 -->
      <path d="M120 19 L128 19" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

      <!-- Phase 2 -->
      <g transform="translate(136, 0)">
        <rect width="112" height="38" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.2" />
        <circle cx="18" cy="19" r="6" fill="#10B981" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#6EE7B7">2 · Perkuat</text>
      </g>

      <!-- Arrow 2 -->
      <path d="M256 19 L264 19" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

      <!-- Phase 3 -->
      <g transform="translate(272, 0)">
        <rect width="105" height="38" rx="10" fill="#451A03" stroke="#F59E0B" stroke-width="1.2" />
        <circle cx="18" cy="19" r="6" fill="#F59E0B" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FCD34D">3 · Kuis</text>
      </g>

      <!-- Arrow 3 -->
      <path d="M385 19 L393 19" stroke="#64748B" stroke-width="2" stroke-linecap="round" />

      <!-- Phase 4 -->
      <g transform="translate(401, 0)">
        <rect width="105" height="38" rx="10" fill="#3B0764" stroke="#A855F7" stroke-width="1.2" />
        <circle cx="18" cy="19" r="6" fill="#A855F7" />
        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#D8B4FE">4 · Uji</text>
      </g>
    </g>
  </g>
</svg>
