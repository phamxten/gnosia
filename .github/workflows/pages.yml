name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['design/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir _site
          cp -r design/mockups design/tokens.css design/tokens.json _site/ 2>/dev/null || true
          mkdir -p _site/design && cp design/tokens.css design/tokens.json _site/design/
          # mockups import ../tokens.css, so keep the design/ layout
          rm -rf _site/mockups _site/tokens.css _site/tokens.json
          cp -r design/mockups _site/design/mockups
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=design/mockups/landing.html">
          <title>GNOSIA</title>
          <a href="design/mockups/landing.html">Buka GNOSIA</a>
          HTML
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
